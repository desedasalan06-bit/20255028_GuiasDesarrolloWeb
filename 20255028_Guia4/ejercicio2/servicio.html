<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="../css/ejercicio_style.css">
    
    <script src="../js/servicio.js" defer></script>
  </head>
  <body>
    <div class="container py-4">
      <h1 class="titulo">Gestión de pedidos de la cafetería</h1>

      
      <div class="card tarjeta">
        <div class="card-header tarjeta-encabezado">Nuevo pedido</div>
        <div class="card-body">
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-5">
                <label for="txtProducto" class="form-label">Producto</label>
                <input type="text" id="txtProducto" class="form-control" placeholder="Ej: Café americano" required />
                <div class="invalid-feedback">Ingrese el nombre del producto.</div>
              </div>
              <div class="col-md-3">
                <label for="txtPrecio" class="form-label">Precio unitario ($)</label>
                <input type="number" id="txtPrecio" class="form-control" step="0.01" min="0.01" placeholder="0.00" required />
                <div class="invalid-feedback">El precio debe ser mayor que cero.</div>
              </div>
              <div class="col-md-2">
                <label for="txtCantidad" class="form-label">Cantidad</label>
                <input type="number" id="txtCantidad" class="form-control" step="1" min="1" placeholder="1" required />
                <div class="invalid-feedback">Debe ser un entero positivo.</div>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="submit" id="btnAgregar" class="btn btn-success w-100">Agregar pedido</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="card tarjeta">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="txtPrecioMaximo" class="form-label">Precio máximo ($)</label>
              <input type="number" id="txtPrecioMaximo" class="form-control" step="0.01" min="0" placeholder="Ej: 3.00" />
              <div class="invalid-feedback">Ingrese un precio máximo válido (0 o mayor).</div>
            </div>
            <div class="col-md-8 d-flex gap-2 flex-wrap">
              <button type="button" id="btnFiltrar" class="btn btn-primary">Filtrar productos</button>
              <button type="button" id="btnMostrarTodos" class="btn btn-secondary">Mostrar todos</button>
              <button type="button" id="btnLimpiar" class="btn btn-danger ms-md-auto">Limpiar pedidos</button>
            </div>
          </div>
          <p id="lblFiltro" class="texto-filtro"></p>
        </div>
      </div>

      <!-- Tabla de pedidos -->
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle tabla-pedidos">
          <thead>
            <tr>
              <th>#</th>
              <th>Producto</th>
              <th>Precio unitario</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody id="tbodyPedidos"></tbody>
        </table>
      </div>

      <!-- Indicadores -->
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card indicador border-primary">
            <div class="card-body">
              <h6 class="indicador-titulo">Total de unidades</h6>
              <p id="lblTotalUnidades" class="indicador-valor">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card indicador border-success">
            <div class="card-body">
              <h6 class="indicador-titulo">Monto total</h6>
              <p id="lblMontoTotal" class="indicador-valor">$0.00</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
